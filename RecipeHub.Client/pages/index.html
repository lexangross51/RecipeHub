<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепты</title>
    <link rel="stylesheet" type="text/css" href="./../assets/styles/styles.css">
</head>
<body>
    <div class="container">
        <div class="search-line">
            <img src="./assets/images/search.png" width="10%">
            <input type="text" id="input-search" placeholder="Искать">
        </div>
        <div class="recipes">
            <ul id="recipes-list">
                <li class="recipe-list-item">
                    <div class="recipe-info-block">
                        <img src="./assets/images/burger.png" class="recipe-image">
                        <div class="recipe-info">
                            <h3>Название рецепта</h3>
                            <p>Время приготовления</p>
                            <ul class="ingredient-list">
                                <li class="ingredient-list-item">Продукт 1</li>
                                <li class="ingredient-list-item">Продукт 2</li>
                                <li class="ingredient-list-item">Продукт 3</li>
                                <li class="ingredient-list-item">Продукт 4</li>
                                <li class="ingredient-list-item">Продукт 5</li>
                            </ul>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
        <div class="add-recipe-block">
            <button id="add-recipe-button"> Добавить новый </button>
        </div>
    </div>
</body>
</html>
