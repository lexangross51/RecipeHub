<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепты</title>
    <link rel="stylesheet" type="text/css" href="./../assets/styles/styles.css">
    <script src="../scripts/mainPage.js"></script>
</head>
<body>
    <div class="container">
        <div class="search-line">
            <img src="../assets/images/search.png" width="10%">
            <input type="text" id="input-search" placeholder="Искать">
        </div>
        <div class="manipulation-block">
            <div id="overlay"></div>
            <!-- Опции для сортировки рецептов -->
            <button id="sort-button">
                <img src='../assets/images/sort.png'>
            </button>
            <div id="sort-options" class="element-info">
                <h3>Сортировать по</h3>
                <div>
                    <input type="radio" name="sort-field" value="name-asc">
                    Название (по возрастанию)
                </div>
                <div>
                    <input type="radio" name="sort-field" value="name-desc"> 
                    Название (по убыванию)
                </div>
                <div>
                    <input type="radio" name="sort-field" value="time-asc">
                    Время приготовления (по возрастанию)
                </div>
                <div>
                    <input type="radio" name="sort-field" value="time-desc">
                    Время приготовления (по убыванию)
                </div>
            </div>

            <!-- Опции для фильтрации рецептов -->
            <button id="filter-button">
                <img src="../assets/images/filter.png">
            </button>
            <div id="filter-options" class="element-info">
                <h3>Фильтрация</h3>
                
                <h4>Выбери продукты</h4>
                <select id="products-selector">
                    <option>Продукт 1</option>
                    <option>Продукт 2</option>
                    <option>Продукт 3</option>
                    <option>Продукт 4</option>
                </select>
                <ul id="selected-products-list"></ul>

                <button id="apply-filters-button">Применить</button>
            </div>
        </div>

        <div class="recipes">
            <ul id="recipes-list"></ul>
        </div>
        <div class="add-recipe-block">
            <button id="add-recipe-button"> Добавить новый </button>
        </div>
    </div>

    <template id="recipe-item-template">
        <li class="recipe-list-item">
            <div class="recipe-info-block">
                <img class="recipe-image">
                <div class="recipe-info">
                    <h3>Название рецепта</h3>
                    <p>Время приготовления</p>
                    <ul class="ingredient-list"></ul>
                </div>
            </div>
        </li>
    </template>

    <template id="ingredient-item-template">
        <li class="ingredient-list-item"></li>
    </template>
</body>
</html>
