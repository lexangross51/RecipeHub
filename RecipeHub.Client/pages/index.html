<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепты</title>
    <link rel="stylesheet" type="text/css" href="./../assets/styles/styles.css">
    <script src="../scripts/mainPage.js"></script>
</head>
<body>
    <div class="container">
        <div class="search-line">
            <img src="../assets/images/search.png" width="10%">
            <input type="text" id="input-search" placeholder="Искать">
        </div>
        <div id="sort-block">
            <span>Сортировать </span>
            <select id="sort-field-select">
                <option value="name-acs">Название (по возрастанию)</option>
                <option value="name-desc">Название (по убыванию)</option>
                <option value="cookingTime-acs">Время приготовления (по возрастанию)</option>
                <option value="cookingTime-desc">Время приготовления (по убыванию)</option>
            </select>
        </div>
        <div class="recipes">
            <ul id="recipes-list"></ul>
        </div>
        <div class="add-recipe-block">
            <button id="add-recipe-button"> Добавить новый </button>
        </div>
    </div>

    <template id="recipe-item-template">
        <li class="recipe-list-item">
            <div class="recipe-info-block">
                <img class="recipe-image">
                <div class="recipe-info">
                    <h3>Название рецепта</h3>
                    <p>Время приготовления</p>
                    <ul class="ingredient-list"></ul>
                </div>
            </div>
        </li>
    </template>

    <template id="ingredient-item-template">
        <li class="ingredient-list-item"></li>
    </template>
</body>
</html>
