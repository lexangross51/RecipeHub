<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/styles/recipeDetails.css">
    <script src="../scripts/recipeDetails.js"></script>
    <title>Описание</title>
</head>
<body>
    <div class="container">
        <img id="recipe-image" src="../assets/images/none.jpg">
        <div class="recipe-info">
            <h2 id="recipe-name"></h2>
            <div id="recipe-description-block" class="element-info">
                <span id="recipe-description"></span>
                <p id="recipe-cooking-time"></p>
            </div>

            <div id="ingredients-info" class="element-info">
                <h4>Ингредиенты</h4>
                <ul id="ingredients-list">
                </ul>
            </div>

            <h3>Шаги приготовления</h3>
            <ul id="steps-list">
            </ul>
        </div>
    </div>

    <template id="ingredient-item-template">
        <li class="ingredient-item">
            <div class="ingredient-item-info">
                <span class="product-name">Продукт</span>
                <span class="product-measure">5 шт</span>
            </div>
        </li>
    </template>

    <template id="step-item-template">
        <li class="step-item element-info">
            <div class="step-item-info">
                <h4 class="step-number"></h4>
                <p class="step-description"></p>
                <img class="step-image" >
            </div>
        </li>
    </template>
</body>
</html>
